_schema-version: 3.3.0
ID: chocolate-supplychain
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: chocolate-supplychain-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    # Added environment variables section below
    
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: chocolate-supplychain-db

  - name: chocolate-supplychain-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      health-check-type: none
    requires:
      - name: chocolate-supplychain-db

resources:
  - name: chocolate-supplychain-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared